name: MoonBit CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          # Use the current official Linux toolchain. Historical toolchain
          # archives are not guaranteed to remain available on the CDN.
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit versions
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check project
        run: moon check --deny-warn --warn-list +73

      - name: Run tests
        run: moon test --deny-warn

      - name: Verify generated interfaces
        shell: bash
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Check versioned compatibility contract
        run: moon run cmd/main -- contract-check configscope.contract.json

      - name: Verify breaking changes fail the gate
        shell: bash
        run: |
          if moon run cmd/main -- contract-check cmd/main/testdata/configscope-breaking.contract.json; then
            echo "Expected the breaking contract check to fail."
            exit 1
          fi

      - name: Verify published package in a fresh consumer project
        run: python3 scripts/check_published_package.py
